# Henter leilighetsnummer (bruksenhetsnummer) fra Kartverket én gang i måneden og lagrer dem i api/data/units.json.
name: Leilighetsnummer fra Kartverket

on:
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Bare vis eksempel (ikke lagre)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  units:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/units.py ${{ github.event.inputs.sample == 'true' && '--sample' || '' }}
      - if: github.event.inputs.sample != 'true'
        run: |
          git config user.name "studiovest-bot"; git config user.email "actions@users.noreply.github.com"
          git add api/data/units.json
          if ! git diff --cached --quiet; then
            git commit -m "Leilighetsnummer fra Kartverket" && git push
            # publiser til studiovest.no (gjør ingenting før siden er lansert)
            gh workflow run live.yml -f mode=deploy || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
